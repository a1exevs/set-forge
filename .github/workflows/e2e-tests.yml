name: E2E Tests

on:
  pull_request:
    branches: [ develop, testing, main ]

jobs:
  client-e2e:
    name: Client (Playwright fullstack)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: |
          npm ci
          npm run client:e2e:install
        env:
          HUSKY: 0

      - name: Prepare e2e env
        run: cp server/.e2e.env.example server/.e2e.env

      - name: Pull MySQL image
        run: docker pull mysql:8.4

      - name: Client e2e tests
        run: npm run client:test:e2e

      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30

  server-e2e:
    name: Server (Jest + Testcontainers)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Prepare e2e env
        run: cp server/.e2e.env.example server/.e2e.env

      - name: Server e2e tests
        run: npm run server:test:e2e
