name: Project test

on:
  push:
    branches: [ develop, testing, main ]
  pull_request:
    branches: [ develop, testing, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Unit tests
        run: |
          npm run client:test:unit
          npm run server:test:unit

      - name: Snapshot tests
        run: npm run client:test:snap
