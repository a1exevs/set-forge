name: Project build

on:
  push:
    branches: [ develop, testing, main ]
  # PRs into any base: develop / testing / main, and the parent branch of sub-issues
  # or the shared branch of parts (/branches §1).
  # Push stays on the protected branches: a push to a work branch with an open PR already runs as that PR.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Styling
        run: |
          npm run format:root:check
          npm run lint:root
          npm run client:format:check
          npm run client:lint
          npm run server:format:check
          npm run server:lint

      - name: Project build
        run: |
          npm run client:build
          npm run server:build

      - name: Client Storybook build
        run: npm run client:build-storybook
