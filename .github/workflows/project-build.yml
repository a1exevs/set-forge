name: Project build

on:
  push:
    branches: [ develop, testing, main ]
  pull_request:
    branches: [ develop, testing, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Styling
        run: |
          npm run format:root:check
          npm run client:format:check
          npm run client:lint
          npm run server:format:check
          npm run server:lint

      - name: Project build
        run: |
          npm run client:build
          npm run server:build

      - name: Client Storybook build
        run: npm run client:build-storybook
