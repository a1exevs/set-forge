# Production front for the Vite SPA: static files, SPA fallback, /api reverse-proxy to Nest.
# Nest global prefix: app.setGlobalPrefix('api/1.0') in server/src/main.ts; /api/ paths are proxied unchanged.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Baseline security headers (repeat in any `location` that uses its own `add_header` — nginx drops inheritance).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # SPA client-side routing (TanStack Router).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse proxy to Nest on the compose network (service server-prod:5000).
  location /api/ {
    proxy_pass http://server-prod:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Long cache for Vite chunk filenames (content-hashed).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }
}
