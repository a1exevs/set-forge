x-mysql-common: &mysql-common
  image: mysql:8.4
  restart: unless-stopped
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    MYSQL_DATABASE: ${MYSQL_DATABASE}
    MYSQL_USER: ${MYSQL_USER}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  mysql:
    <<: *mysql-common
    profiles: ["prod"]
    volumes:
      - mysql_data_prod:/var/lib/mysql

  mysql-dev:
    <<: *mysql-common
    profiles: ["dev"]
    ports:
      - "127.0.0.1:${MYSQL_PUBLIC_PORT:-3306}:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql

  server-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: server/Dockerfile
      target: production
    env_file:
      - ./server/.production.env
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "5000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+(process.env.PORT||5000)+'/api/1.0/health',(r)=>{r.resume();r.on('end',()=>process.exit(r.statusCode===200?0:1));}).on('error',()=>process.exit(1));\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  client-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      server-prod:
        condition: service_healthy
    ports:
      # Default 8080: on Windows host port 80 is often reserved (HTTP.sys / excluded ranges).
      # On a VDS set CLIENT_PUBLIC_PORT=80 in a root `.env` or your environment on Linux VDS if you want the usual HTTP port.
      - "${CLIENT_PUBLIC_PORT:-8080}:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data_prod:
  mysql_data_dev:
